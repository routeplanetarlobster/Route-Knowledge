<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#12151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Route Knowledge &mdash; Adelaide Metro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --ink:#12151a;
  --panel:#1a1f28;
  --panel-raised:#222834;
  --steel:#3a4351;
  --steel-soft:#2a303c;
  --paper:#e9e6dc;
  --muted:#8b93a1;
  --yellow:#f0b429;
  --green:#3fb37f;
  --red:#e2543d;
}
*{box-sizing:border-box;}
.rk-root{
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100%;
  padding:0;
  border-radius:12px;
  overflow:hidden;
}
.rk-topbar{
  padding:22px 24px 16px;
  border-bottom:1px solid var(--steel-soft);
  background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
}
.rk-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  color:var(--yellow);
  text-transform:uppercase;
  margin:0 0 2px;
}
.rk-title{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:0.02em;
  text-transform:uppercase;
  margin:0 0 16px;
}
.rk-tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
@media (max-width:600px){
  .rk-tabs{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    margin:0 -24px;
    padding:0 24px 4px;
  }
  .rk-tabs::-webkit-scrollbar{ display:none; }
  .rk-tab{ flex-shrink:0; }
}
.rk-tab{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  background:var(--panel);
  border:1px solid var(--steel);
  color:var(--muted);
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  transition:all .15s ease;
  border-left:3px solid var(--line-hue, var(--steel));
}
.rk-tab:hover{color:var(--paper);}
.rk-tab.active{
  background:var(--panel-raised);
  color:var(--paper);
  border-color:var(--steel);
  border-left:3px solid var(--line-hue, var(--yellow));
}
.rk-tab:focus-visible, .rk-btn:focus-visible, .rk-input:focus-visible, .rk-icon-btn:focus-visible{
  outline:2px solid var(--yellow);
  outline-offset:2px;
}

.rk-body{
  padding:22px 24px 28px;
}
.rk-modebar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:12px;
  flex-wrap:wrap;
}
.rk-linelabel{
  font-family:'Oswald',sans-serif;
  font-size:15px;
  letter-spacing:0.03em;
  color:var(--paper);
}
.rk-linelabel .n{
  font-family:'JetBrains Mono',monospace;
  color:var(--muted);
  font-size:12px;
  margin-left:8px;
}
.rk-btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:12.5px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  background:var(--panel-raised);
  border:1px solid var(--steel);
  color:var(--paper);
  padding:9px 16px;
  border-radius:6px;
  cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
.rk-btn:hover{background:#2b3242;}
.rk-btn:active{transform:scale(0.98);}
.rk-btn.primary{
  background:var(--yellow);
  color:#241c04;
  border-color:var(--yellow);
}
.rk-btn.primary:hover{background:#f5c34f;}
.rk-btn.quiz-active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

/* Track diagram */
.rk-track{
  position:relative;
  padding-left:26px;
}
.rk-track::before{
  content:"";
  position:absolute;
  left:9px;
  top:14px;
  bottom:14px;
  width:2px;
  background:repeating-linear-gradient(180deg, var(--steel) 0 8px, transparent 8px 14px);
}
.rk-seg{
  position:relative;
  background:var(--panel);
  border:1px solid var(--steel-soft);
  border-radius:8px;
  padding:14px 16px;
  margin-bottom:10px;
  animation:rkFadeIn .35s ease both;
}
.rk-seg::before{
  content:"";
  position:absolute;
  left:-26px;
  top:50%;
  transform:translateY(-50%);
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--ink);
  border:2px solid var(--line-hue, var(--yellow));
}
@keyframes rkFadeIn{
  from{opacity:0; transform:translateY(4px);}
  to{opacity:1; transform:translateY(0);}
}
.rk-seg-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
}
.rk-stations{
  font-family:'Oswald',sans-serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:0.01em;
}
.rk-stations .arrow{color:var(--muted); margin:0 6px; font-weight:400;}
.rk-tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:6px;
}
.rk-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  background:var(--panel-raised);
  border:1px solid var(--steel-soft);
  padding:2px 8px;
  border-radius:4px;
}
.rk-board{
  font-family:'JetBrains Mono',monospace;
  font-weight:600;
  font-size:16px;
  color:#241c04;
  background:var(--yellow);
  border-radius:5px;
  padding:6px 10px;
  min-width:64px;
  text-align:center;
  line-height:1.1;
  flex-shrink:0;
}
.rk-board .u{display:block; font-size:8px; letter-spacing:0.06em; margin-top:1px;}
.rk-board.hidden{
  background:var(--panel-raised);
  color:var(--muted);
  border:1px dashed var(--steel);
}
.rk-seg-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}
.rk-icon-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  background:none;
  border:1px solid var(--steel-soft);
  color:var(--muted);
  padding:5px 10px;
  border-radius:5px;
  cursor:pointer;
}
.rk-icon-btn:hover{color:var(--paper); border-color:var(--steel);}
.rk-icon-btn.danger:hover{color:var(--red); border-color:var(--red);}

/* Quiz */
.rk-quiz-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}
.rk-input{
  font-family:'JetBrains Mono',monospace;
  background:var(--ink);
  border:1px solid var(--steel);
  color:var(--paper);
  padding:8px 10px;
  border-radius:5px;
  width:100px;
  font-size:14px;
}
.rk-feedback{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
}
.rk-feedback.correct{color:var(--green);}
.rk-feedback.wrong{color:var(--red);}
.rk-quizbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel-raised);
  border:1px solid var(--steel-soft);
  border-radius:8px;
  padding:12px 16px;
  margin-bottom:16px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  color:var(--muted);
}
.rk-quizbar b{color:var(--paper);}

/* Add form */
.rk-form{
  background:var(--panel);
  border:1px solid var(--steel-soft);
  border-radius:8px;
  padding:16px;
  margin-top:16px;
}
.rk-form-title{
  font-family:'Oswald',sans-serif;
  font-size:13px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 12px;
}
.rk-form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.rk-form-grid.full{grid-template-columns:1fr;}
.rk-field label{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.05em;
  margin-bottom:4px;
}
.rk-field input, .rk-field textarea{
  width:100%;
  background:var(--ink);
  border:1px solid var(--steel);
  color:var(--paper);
  padding:8px 10px;
  border-radius:5px;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
}
.rk-field textarea{resize:vertical; min-height:44px;}
.rk-form-actions{
  margin-top:12px;
  display:flex;
  gap:8px;
}

.rk-empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
  font-size:13.5px;
}
.rk-empty .big{
  font-family:'Oswald',sans-serif;
  font-size:16px;
  color:var(--paper);
  margin-bottom:6px;
}
.rk-quiz-done{
  text-align:center;
  padding:30px 20px;
}
.rk-quiz-done .score{
  font-family:'Oswald',sans-serif;
  font-size:34px;
  color:var(--yellow);
}
@media (max-width:480px){
  .rk-form-grid{grid-template-columns:1fr;}
  .rk-title{font-size:21px;}
  .rk-topbar{padding:16px 16px 12px;}
  .rk-body{padding:16px 16px 24px;}
  .rk-tabs{margin:0 -16px; padding:0 16px 4px;}
  .rk-net-node{margin-left:12px; padding-left:12px;}
}
.rk-net-tree{
  margin-top:6px;
  animation:rkFadeIn .3s ease both;
}
.rk-net-hub{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:0.06em;
  background:var(--panel-raised);
  border:1px solid var(--steel);
  border-radius:6px;
  padding:10px 18px;
  display:inline-block;
  margin-bottom:6px;
}
.rk-net-node{
  margin-left:20px;
  padding-left:20px;
  border-left:2px dashed var(--steel-soft);
}
.rk-net-row{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 0;
}
.rk-net-row::before{
  content:"";
  position:absolute;
  left:-20px;
  top:50%;
  width:18px;
  height:2px;
  background:var(--steel-soft);
}
.rk-net-junction-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.rk-net-line-btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13.5px;
  letter-spacing:0.02em;
  background:var(--panel);
  border:1px solid var(--steel-soft);
  border-left-width:4px;
  border-left-style:solid;
  color:var(--paper);
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  transition:background .15s ease;
}
.rk-net-line-btn:hover{
  background:var(--panel-raised);
}
.rk-ts-toggle{
  display:flex;
  gap:6px;
  margin-bottom:16px;
}
.rk-ts-list{
  animation:rkFadeIn .3s ease both;
}
.rk-ts-station{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  color:var(--paper);
  background:var(--panel-raised);
  border-left:3px solid var(--yellow);
  padding:8px 14px;
  margin:14px 0 6px;
  border-radius:4px;
}
.rk-ts-station:first-child{ margin-top:0; }
.rk-ts-row{
  display:flex;
  align-items:baseline;
  gap:12px;
  padding:7px 14px 7px 20px;
  border-bottom:1px solid var(--steel-soft);
}
.rk-ts-speed{
  font-family:'JetBrains Mono',monospace;
  font-weight:600;
  font-size:14px;
  color:var(--yellow);
  min-width:64px;
}
.rk-ts-dist{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  color:var(--muted);
  flex:1;
}
.rk-ts-comment{
  font-family:'Inter',sans-serif;
  font-size:12px;
  color:var(--muted);
  font-style:italic;
html, body{
  margin:0;
  padding:0;
  background:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
</style>
</head>
<body>

<div class="rk-root" id="rk-root">
  <div class="rk-topbar">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <div>
        <p class="rk-eyebrow">Adelaide Metro · Rail Operations</p>
        <h1 class="rk-title">Route Knowledge</h1>
      </div>
      <div style="display:flex; gap:8px; margin-top:2px;">
        <button class="rk-btn" id="rk-network-btn">Network Overview</button>
        <button class="rk-btn" id="rk-track-btn">Track Speeds</button>
      </div>
    </div>
    <div class="rk-tabs" id="rk-tabs"></div>
  </div>
  <div class="rk-body" id="rk-body"></div>
</div>

<script>
(function(){
  const LINES = [
    {id:'gawler_down', name:'Gawler Line', hue:'#e2913d', direction:'Down'},
    {id:'gawler_up', name:'Gawler Line', hue:'#e2913d', direction:'Up'},
    {id:'grange_down', name:'Grange Line', hue:'#4f8fe2', direction:'Down'},
    {id:'grange_up', name:'Grange Line', hue:'#4f8fe2', direction:'Up'},
    {id:'outerharbor_down', name:'Outer Harbor Line', hue:'#8a6de2', direction:'Down'},
    {id:'outerharbor_up', name:'Outer Harbor Line', hue:'#8a6de2', direction:'Up'},
    {id:'portdock_down', name:'Port Dock Line', hue:'#2fb8b0', direction:'Down'},
    {id:'portdock_up', name:'Port Dock Line', hue:'#2fb8b0', direction:'Up'},
    {id:'seaford_down', name:'Seaford Line', hue:'#3fb37f', direction:'Down'},
    {id:'seaford_up', name:'Seaford Line', hue:'#3fb37f', direction:'Up'},
    {id:'belair_down', name:'Belair Line', hue:'#e2543d', direction:'Down'},
    {id:'belair_up', name:'Belair Line', hue:'#e2543d', direction:'Up'},
    {id:'tonsley_down', name:'Flinders Line', hue:'#d84f9e', direction:'Down'},
    {id:'tonsley_up', name:'Flinders Line', hue:'#d84f9e', direction:'Up'},
  ];

  let activeLine = LINES[0].id;
  let quizModeType = null; // null | 'segment' | 'range'
  let quizRangeGuesses = {}; // pairKey -> array of per-box guess strings
  let quizRangeBoxChecked = {}; // pairKey -> array of booleans
  let hideSpeeds = true;
  let showAddForm = false;
  let showImportForm = false;
  let segCache = {}; // lineId -> array

  const root = document.getElementById('rk-root');
  const tabsEl = document.getElementById('rk-tabs');
  const bodyEl = document.getElementById('rk-body');
  const networkBtn = document.getElementById('rk-network-btn');
  const trackBtn = document.getElementById('rk-track-btn');
  let showNetwork = false;
  let showTrackSpeeds = false;
  let trackSpeedsDir = 'seaford_down';

  const NETWORK_TREE = [
    { type:'line', name:'Gawler Line', lineId:'gawler_down' },
    { type:'junction', name:'Woodville', children: [
        { type:'line', name:'Grange Line', lineId:'grange_down' },
        { type:'junction', name:'Alberton', children: [
            { type:'line', name:'Port Dock Line', lineId:'portdock_down' },
            { type:'line', name:'Outer Harbor Line', lineId:'outerharbor_down' },
        ]},
    ]},
    { type:'junction', name:'Goodwood', children: [
        { type:'line', name:'Belair Line', lineId:'belair_down' },
        { type:'junction', name:'just before Ascot Park', children: [
            { type:'line', name:'Seaford Line', lineId:'seaford_down' },
            { type:'line', name:'Flinders Line', lineId:'tonsley_down' },
        ]},
    ]},
  ];

  function lineColor(lineId){
    const l = LINES.find(x => x.id === lineId);
    return l ? l.hue : '#8b93a1';
  }

  function buildNetNode(node){
    const wrap = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'rk-net-row';
    if(node.type === 'line'){
      const btn = document.createElement('button');
      btn.className = 'rk-net-line-btn';
      btn.style.borderLeftColor = lineColor(node.lineId);
      btn.textContent = node.name;
      btn.onclick = () => {
        activeLine = node.lineId;
        showNetwork = false;
        renderTabs();
        renderBody();
      };
      row.appendChild(btn);
    } else {
      const label = document.createElement('span');
      label.className = 'rk-net-junction-label';
      label.textContent = node.name + ' junction';
      row.appendChild(label);
    }
    wrap.appendChild(row);
    if(node.children){
      const childWrap = document.createElement('div');
      childWrap.className = 'rk-net-node';
      node.children.forEach(c => childWrap.appendChild(buildNetNode(c)));
      wrap.appendChild(childWrap);
    }
    return wrap;
  }

  function renderNetworkOverview(){
    const container = document.createElement('div');
    container.className = 'rk-net-tree';

    const hub = document.createElement('div');
    hub.className = 'rk-net-hub';
    hub.textContent = 'ADELAIDE';
    container.appendChild(hub);

    const rootWrap = document.createElement('div');
    rootWrap.className = 'rk-net-node';
    NETWORK_TREE.forEach(n => rootWrap.appendChild(buildNetNode(n)));
    container.appendChild(rootWrap);

    const note = document.createElement('p');
    note.style.cssText = 'margin-top:20px; font-family:\'JetBrains Mono\',monospace; font-size:11px; color:var(--muted); line-height:1.6;';
    note.textContent = 'Schematic only \u2014 not to scale, and not the official Adelaide Metro map. Click a line to open it.';
    container.appendChild(note);

    bodyEl.appendChild(container);
  }

  networkBtn.onclick = () => { showNetwork = !showNetwork; showTrackSpeeds = false; renderBody(); };
  trackBtn.onclick = () => { showTrackSpeeds = !showTrackSpeeds; showNetwork = false; renderBody(); };

  // Raw kilometrage data transcribed directly from the official Seaford Down/Up addenda screenshots.
  // km: null means no kilometrage was given in the source document for that row.
  const TRACK_SPEED_DATA = {
    seaford_down: [
      {km:0.000, label:'Adelaide', speed:15, comment:'No permanent speed sign at 0.000'},
      {km:null, label:null, speed:35, comment:'At the end of the platform'},
      {km:0.872, label:null, speed:60, comment:null},
      {km:1.975, label:'Mile End', speed:null, comment:null},
      {km:2.121, label:null, speed:110, comment:null},
      {km:4.116, label:'Adelaide Showground', speed:null, comment:null},
      {km:4.196, label:null, speed:80, comment:null},
      {km:4.630, label:null, speed:60, comment:null},
      {km:4.945, label:'Goodwood', speed:null, comment:null},
      {km:5.714, label:null, speed:90, comment:null},
      {km:6.308, label:'Clarence Park', speed:null, comment:null},
      {km:7.138, label:'Emerson', speed:null, comment:null},
      {km:7.178, label:null, speed:70, comment:null},
      {km:7.850, label:'Edwardstown', speed:null, comment:null},
      {km:8.091, label:null, speed:50, comment:null},
      {km:8.235, label:null, speed:70, comment:null},
      {km:8.364, label:null, speed:110, comment:null},
      {km:9.115, label:'Woodlands Park', speed:null, comment:null},
      {km:10.094, label:null, speed:90, comment:null},
      {km:10.176, label:'Ascot Park', speed:null, comment:null},
      {km:11.240, label:null, speed:110, comment:null},
      {km:11.380, label:'Marion', speed:null, comment:null},
      {km:12.392, label:null, speed:90, comment:null},
      {km:12.861, label:null, speed:60, comment:null},
      {km:12.944, label:'Oaklands', speed:null, comment:null},
      {km:13.455, label:null, speed:100, comment:null},
      {km:13.703, label:'Warradale', speed:null, comment:null},
      {km:14.589, label:null, speed:55, comment:null},
      {km:14.613, label:'Hove', speed:null, comment:null},
      {km:15.840, label:'Brighton', speed:null, comment:null},
      {km:16.279, label:null, speed:80, comment:null},
      {km:16.920, label:'Seacliff Up', speed:null, comment:null},
      {km:17.105, label:'Seacliff Down', speed:null, comment:null},
      {km:18.039, label:null, speed:100, comment:null},
      {km:18.292, label:'Marino', speed:null, comment:null},
      {km:18.915, label:'Marino Rocks', speed:null, comment:null},
      {km:21.391, label:'Hallett Cove', speed:null, comment:null},
      {km:22.972, label:'Hallett Cove Beach', speed:null, comment:null},
      {km:23.293, label:null, speed:85, comment:null},
      {km:23.633, label:null, speed:100, comment:null},
      {km:25.248, label:null, speed:70, comment:null},
      {km:26.068, label:null, speed:100, comment:null},
      {km:26.345, label:null, speed:110, comment:null},
      {km:26.648, label:'Lonsdale', speed:null, comment:null},
      {km:28.704, label:null, speed:85, comment:null},
      {km:28.900, label:'Christie Downs', speed:null, comment:null},
      {km:29.030, label:null, speed:110, comment:null},
      {km:29.980, label:null, speed:70, comment:null},
      {km:30.208, label:'Noarlunga Centre', speed:null, comment:null},
      {km:30.350, label:null, speed:110, comment:null},
      {km:34.483, label:null, speed:100, comment:null},

    const wrap = document.createElement('div');

    toggle.className = 'rk-ts-toggle';
    toggle.style.flexWrap = 'wrap';
    TRACK_SPEED_TABS.forEach(tab => {

    });
    wrap.appendChild(toggle);

    const rows = TRACK_SPEED_DATA[trackSpeedsDir];
    rows.forEach((row, i) => {
      if(row.label){
        const stationEl = document.createElement('div');
        stationEl.className = 'rk-ts-station';
        stationEl.textContent = row.label;
        wrap.appendChild(stationEl);
      }
      if(row.speed !== null){
        let endRow = null;
        for(let j = i + 1; j < rows.length; j++){
          if(rows[j].speed !== null){ endRow = rows[j]; break; }
        }
        if(!endRow){
          const lastRow = rows[rows.length - 1];
          if(lastRow && lastRow !== row && lastRow.km !== null) endRow = lastRow;
        }
        let distText;
        if(row.km === null){
          distText = 'exact km not given in source';
        } else if(endRow && endRow.km !== null){
          distText = 'for ' + Math.abs(endRow.km - row.km).toFixed(3) + ' km';
        } else {
          distText = 'distance not given in source';
        }
        const rowEl = document.createElement('div');
        rowEl.className = 'rk-ts-row';
        const speedEl = document.createElement('span');
        speedEl.className = 'rk-ts-speed';
        speedEl.textContent = row.speed + ' km/h';
        rowEl.appendChild(speedEl);
        const distEl = document.createElement('span');
        distEl.className = 'rk-ts-dist';
        distEl.textContent = distText + (row.km !== null ? ' (from km ' + row.km.toFixed(3) + ')' : '');
        rowEl.appendChild(distEl);
        if(row.comment){
          const commentEl = document.createElement('span');
          commentEl.className = 'rk-ts-comment';
          commentEl.textContent = row.comment;
          rowEl.appendChild(commentEl);
        }
        wrap.appendChild(rowEl);

    });

    },
    async set(key, value){
      localStorage.setItem('rk:' + key, value);

    return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const parts = l.split(',').map(p => p.trim());
      if(parts.length >= 3 && parts[0] && parts[1] && parts[2] !== ''){
        return {
          id: 'seg_' + Date.now() + '_' + Math.floor(Math.random()*1000000),
          from: parts[0],
          to: parts[1],
          speed: parts[2],
          note: parts[3] || undefined,
        };
      }
      return null;
    }).filter(Boolean);

  async function loadSegments(lineId){
    if(segCache[lineId]) return segCache[lineId];
    let arr;
    try{
      const res = await storageAdapter.get(storageKey(lineId), false);
      if(res && res.value){
        arr = JSON.parse(res.value);
      } else if(SEED_DATA[lineId]){
        arr = parseSegmentLines(SEED_DATA[lineId]);
        await saveSegments(lineId, arr);
      } else {
        arr = [];
      }
    }catch(e){
      if(SEED_DATA[lineId]){
        arr = parseSegmentLines(SEED_DATA[lineId]);
        await saveSegments(lineId, arr);
      } else {
        arr = [];
      }
    }

    // one-time forced reseed when a newer, cleaner source is available
    if(SEED_VERSION[lineId]){
      const verKey = 'seedver:' + lineId;
      let storedVer = null;
      try{
        const vres = await storageAdapter.get(verKey, false);
        storedVer = vres && vres.value ? vres.value : null;
      }catch(e){ storedVer = null; }
      if(storedVer !== SEED_VERSION[lineId]){
        arr = parseSegmentLines(SEED_DATA[lineId]);
        await saveSegments(lineId, arr);
        try{ await storageAdapter.set(verKey, SEED_VERSION[lineId], false); }catch(e){}
      }
    }

    segCache[lineId] = arr;
    return arr;
  }

  async function saveSegments(lineId, arr){
    segCache[lineId] = arr;
    try{
      await storageAdapter.set(storageKey(lineId), JSON.stringify(arr), false);
    }catch(e){
      console.error('Storage save failed', e);
    }
  }

  function parseCardFormat(text){
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const numRe = /^\d+(\.\d+)?$/;
    const leadingNumParen = /^(\d+(?:\.\d+)?)\s*\((.*)\)$/; // e.g. "35 (no board placed - turn out)"
    const kphEmbedded = /\(([^)]*?)(\d+(?:\.\d+)?)\s*k?ph([^)]*)\)/i; // e.g. "(Siding - 15 kph)"
    const stations = [];
    let current = null;
    lines.forEach(line => {
      let speedVal = null;
      let noteVal = null;
      if(numRe.test(line)){
        speedVal = line;
      } else {
        const m1 = line.match(leadingNumParen);
        if(m1){
          speedVal = m1[1];
          noteVal = m1[2].trim();
        } else {
          const m2 = line.match(kphEmbedded);
          if(m2){
            speedVal = m2[2];
            noteVal = (m2[1] + m2[3]).replace(/[-–]\s*$/, '').trim();
          }
        }
      }
      if(speedVal !== null){
        if(current) current.speeds.push({ value: speedVal, note: noteVal });
      } else {
        current = { name: line, speeds: [] };
        stations.push(current);
      }
    });

    const segments = [];
    let lastSpeed = null;
    for(let i = 0; i < stations.length - 1; i++){
      const cur = stations[i];
      const next = stations[i+1];
      if(cur.speeds.length === 0){
        segments.push({ from: cur.name, to: next.name, speed: lastSpeed !== null ? lastSpeed : '', note: undefined });
      } else {
        let fromPoint = cur.name;
        cur.speeds.forEach((sp, j) => {
          const isLast = j === cur.speeds.length - 1;
          const toPoint = isLast ? next.name : (cur.name + ' (' + (j+2) + ')');
          segments.push({ from: fromPoint, to: toPoint, speed: sp.value, note: sp.note || undefined });
          lastSpeed = sp.value;
          fromPoint = toPoint;
        });
      }
    }
    const last = stations[stations.length - 1];
    if(last && last.speeds.length){
      let fromPoint = last.name;
      last.speeds.forEach((sp, j) => {
        const isLast = j === last.speeds.length - 1;
        const toPoint = isLast ? 'End of Line' : (last.name + ' (' + (j+2) + ')');
        segments.push({ from: fromPoint, to: toPoint, speed: sp.value, note: sp.note || undefined });
        fromPoint = toPoint;
      });
    }
    return segments.map(s => ({
      id: 'seg_' + Date.now() + '_' + Math.floor(Math.random()*1000000),
      from: s.from,
      to: s.to,
      speed: s.speed,
      note: s.note,
    }));
  }

    const field = document.createElement('div');
    field.className = 'rk-field';
    const textarea = document.createElement('textarea');
    textarea.style.minHeight = '180px';

    if(importFormatMode === 'card'){
      hint.textContent = 'Paste a station card as-is: station name on its own line, followed by each speed change before the next station (blank line between stations if you like). No speed lines under a station just means the speed carries through unchanged.';
      textarea.placeholder = 'Adelaide\n15\n35\n60\nMile End\n110\nShowgrounds\n80\n60\nGoodwood\n90\nClarence Park\nEmerson\n70\n...';
    } else {
      hint.textContent = 'One segment per line: From, To, Speed (km/h). Example: Adelaide, Goodwood, 90';
      textarea.placeholder = 'Adelaide, Goodwood, 90\nGoodwood, Adelaide, 90\nGoodwood, Clarence Park, 100\n...';
    }
    wrap.appendChild(hint);
    field.appendChild(textarea);
    wrap.appendChild(field);

    const status = document.createElement('p');
    status.style.cssText = 'font-family:JetBrains Mono, monospace; font-size:12px; margin:10px 0 0;';

    const importBtnGo = document.createElement('button');
    importBtnGo.className = 'rk-btn primary';
    importBtnGo.textContent = 'Import';
    importBtnGo.onclick = async () => {
      let added, skipped;
      if(importFormatMode === 'card'){
        added = parseCardFormat(textarea.value);
        skipped = 0;
      } else {
        const lines = textarea.value.split('\n').map(l => l.trim()).filter(Boolean);
        added = parseSegmentLines(textarea.value);
        skipped = lines.length - added.length;
      }
      const updated = [...segs, ...added];
      await saveSegments(line.id, updated);
      status.style.color = skipped ? 'var(--yellow)' : 'var(--green)';
      status.textContent = 'Added ' + added.length + ' segment' + (added.length===1?'':'s') +
        (skipped ? ('. Skipped ' + skipped + ' line(s) — needs From, To, Speed.') : '.');
      if(added.length){
        setTimeout(() => { showImportForm = false; renderBody(); }, 900);
      }
    };
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'rk-btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { showImportForm = false; renderBody(); };
    actions.appendChild(importBtnGo);
    actions.appendChild(cancelBtn);
    wrap.appendChild(actions);

    return wrap;
  }

    stations.innerHTML = escapeHtml(seg.from) + '<span class="arrow">→</span>' + escapeHtml(seg.to);

      noteTags.className = 'rk-tags';
      noteTags.appendChild(makeTag(seg.note));

    top.appendChild(left);

    if(hideSpeeds){
      board.classList.add('hidden');
      board.innerHTML = '?<span class="u">km/h</span>';

      board.title = 'Click to reveal';
      board.onclick = () => {
        board.classList.remove('hidden');
        board.innerHTML = (seg.speed || '—') + '<span class="u">km/h</span>';
        board.style.cursor = 'default';
        board.onclick = null;
      };
    } else {
      board.innerHTML = (seg.speed || '—') + '<span class="u">km/h</span>';
    }
    top.appendChild(board);

    card.appendChild(top);

    const actions = document.createElement('div');
    actions.className = 'rk-seg-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'rk-icon-btn';
    editBtn.textContent = 'Edit';
    editBtn.onclick = () => { openEditForm(seg, line, segs); };
    const delBtn = document.createElement('button');
    delBtn.className = 'rk-icon-btn danger';
    delBtn.textContent = 'Delete';
    delBtn.onclick = async () => {
      const updated = segs.filter(s => s.id !== seg.id);
      await saveSegments(line.id, updated);
      renderBody();
    };
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    card.appendChild(actions);

    return card;
  }

    const d = document.createElement('div');

    const fSpeed = fieldInput('Max speed (km/h)', 'speed', editSeg && editSeg.speed, 'number');

      const fromVal = fFrom.input.value.trim();

      if(!fromVal || !toVal){ fFrom.input.focus(); return; }
      const newSeg = {
        id: editSeg ? editSeg.id : ('seg_' + Date.now() + '_' + Math.floor(Math.random()*1000)),
        from: fromVal,
        to: toVal,
        speed: fSpeed.input.value.trim(),
      };
      let updated;
      if(editSeg){
        updated = segs.map(s => s.id === editSeg.id ? newSeg : s);

        updated = [...segs, newSeg];

      await saveSegments(line.id, updated);

      renderBody();

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'rk-btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { showAddForm = false; renderBody(); };

    return {wrap, input};
  }

  function openEditForm(seg, line, segs){
    showAddForm = false;
    bodyEl.querySelectorAll('.rk-form').forEach(f => f.remove());
    bodyEl.appendChild(renderAddForm(line, segs, seg));
    bodyEl.lastChild.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function isNamedStation(name){
    if(!name) return false;
    const n = name.trim();
    if(n.toLowerCase().startsWith('km ')) return false;
    if(n.includes('(')) return false;
    return true;
  }

  function computeRangePairs(segs){
    if(!segs.length) return [];
    const points = [segs[0].from];
    segs.forEach(s => points.push(s.to));
    const namedIdx = [];
    points.forEach((p, i) => { if(isNamedStation(p)) namedIdx.push(i); });
    const pairs = [];
    for(let k = 0; k < namedIdx.length - 1; k++){
      const idxA = namedIdx[k], idxB = namedIdx[k+1];
      const speeds = [];
      for(let s = idxA; s < idxB; s++){
        const sp = segs[s].speed;
        const note = segs[s].note || null;
        if(speeds.length === 0 || speeds[speeds.length-1].value !== sp){
          speeds.push({ value: sp, note: note });
        } else if(note && !speeds[speeds.length-1].note){
          speeds[speeds.length-1].note = note;
        }
      }
      pairs.push({ key: idxA + '_' + idxB, from: points[idxA], to: points[idxB], speeds });
    }
    return pairs;
  }

  function renderQuizRange(segs, line){
    const pairs = computeRangePairs(segs);
    if(pairs.length === 0){
      const empty = document.createElement('div');
      empty.className = 'rk-empty';
      empty.innerHTML = '<div class="big">Not enough named stations yet</div>' +
        'Range Quiz needs at least two recognizable named stations in this line\u2019s segments to build station-to-station questions.';
      bodyEl.appendChild(empty);
      return;
    }

    // ensure each pair has guess + checked arrays matching its number of speed changes
    pairs.forEach(pair => {
      if(!Array.isArray(quizRangeGuesses[pair.key]) || quizRangeGuesses[pair.key].length !== pair.speeds.length){
        quizRangeGuesses[pair.key] = new Array(pair.speeds.length).fill('');
      }
      if(!Array.isArray(quizRangeBoxChecked[pair.key]) || quizRangeBoxChecked[pair.key].length !== pair.speeds.length){
        quizRangeBoxChecked[pair.key] = new Array(pair.speeds.length).fill(false);
      }
    });

    let totalBoxes = 0, checkedBoxes = 0, correctBoxes = 0;
    pairs.forEach(pair => {
      pair.speeds.forEach((sp, i) => {
        totalBoxes++;
        if(quizRangeBoxChecked[pair.key][i]){
          checkedBoxes++;
          const g = quizRangeGuesses[pair.key][i];
          if(g !== '' && g !== undefined && Number(g) === Number(sp.value)) correctBoxes++;
        }
      });
    });

    const bar = document.createElement('div');
    bar.className = 'rk-quizbar';
    if(checkedBoxes === 0){
      bar.innerHTML = '<span>Type a speed and tab/enter to check it instantly</span><span>' + totalBoxes + ' blanks</span>';
    } else {
      bar.innerHTML = '<span>Checked ' + checkedBoxes + ' / ' + totalBoxes + '</span><span>Correct: <b>' + correctBoxes + '</b></span>';
    }
    bodyEl.appendChild(bar);

    const track = document.createElement('div');
    track.className = 'rk-track';

    pairs.forEach(pair => {
      const card = document.createElement('div');
      card.className = 'rk-seg';

      const top = document.createElement('div');
      top.className = 'rk-seg-top';
      const left = document.createElement('div');
      left.style.flex = '1';
      left.style.minWidth = '200px';
      const stations = document.createElement('div');
      stations.className = 'rk-stations';
      stations.innerHTML = escapeHtml(pair.from) + '<span class="arrow">→</span>' + escapeHtml(pair.to);
      left.appendChild(stations);
      const hint = document.createElement('div');
      hint.className = 'rk-tags';
      hint.appendChild(makeTag(pair.speeds.length + ' speed change' + (pair.speeds.length===1?'':'s')));
      left.appendChild(hint);
      top.appendChild(left);
      card.appendChild(top);

      const boxCol = document.createElement('div');
      boxCol.style.cssText = 'display:flex; flex-direction:column; gap:6px; margin-top:10px; max-width:260px;';

      pair.speeds.forEach((sp, i) => {
        const isChecked = quizRangeBoxChecked[pair.key][i];
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:8px;';

        if(!isChecked){
          const input = document.createElement('input');
          input.className = 'rk-input';
          input.type = 'number';
          input.style.width = '140px';
          input.placeholder = 'speed ' + (i+1);
          input.value = quizRangeGuesses[pair.key][i] || '';
          input.addEventListener('input', () => { quizRangeGuesses[pair.key][i] = input.value; });
          input.addEventListener('blur', () => {
            if(input.value.trim() !== ''){
              quizRangeBoxChecked[pair.key][i] = true;
              renderBody();
            }
          });
          input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); input.blur(); } });
          row.appendChild(input);
        } else {
          const guess = quizRangeGuesses[pair.key][i];
          const boxCorrect = guess !== '' && guess !== undefined && Number(guess) === Number(sp.value);
          const chip = document.createElement('div');
          chip.className = 'rk-board';
          chip.style.width = '140px';
          chip.style.cursor = 'pointer';
          chip.title = 'Click to try this one again';
          chip.style.background = boxCorrect ? 'var(--green)' : 'var(--red)';
          chip.style.color = '#0d1410';
          chip.innerHTML = boxCorrect
            ? sp.value + '<span class="u">km/h</span>'
            : (guess || '—') + ' <span class="u">(was ' + sp.value + ')</span>';
          chip.onclick = () => { quizRangeBoxChecked[pair.key][i] = false; renderBody(); };
          row.appendChild(chip);
        }

        if(sp.note){
          const noteLabel = document.createElement('span');
          noteLabel.style.cssText = 'font-family:\'JetBrains Mono\',monospace; font-size:11px; color:var(--yellow); white-space:nowrap;';
          noteLabel.textContent = sp.note;
          row.appendChild(noteLabel);
        }

        boxCol.appendChild(row);
      });

      card.appendChild(boxCol);
      track.appendChild(card);
    });

    bodyEl.appendChild(track);

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:10px; margin-top:16px;';
    const resetBtn = document.createElement('button');
    resetBtn.className = 'rk-btn primary';
    resetBtn.textContent = 'Reset Quiz';
    resetBtn.onclick = () => { quizRangeGuesses = {}; quizRangeBoxChecked = {}; renderBody(); };
    actions.appendChild(resetBtn);
    bodyEl.appendChild(actions);

    if(checkedBoxes < totalBoxes){
      setTimeout(() => {
        const firstInput = bodyEl.querySelector('.rk-input');
        if(firstInput) firstInput.focus();
      }, 30);
    }
  }

  renderTabs();
  renderBody();
})();
</script>
</body>
</html>
